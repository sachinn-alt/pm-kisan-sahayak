<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4fbf5"/>
      <stop offset="100%" stop-color="#e3f6e8"/>
    </radialGradient>
    <linearGradient id="orangeFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa01c"/>
      <stop offset="100%" stop-color="#eb6300"/>
    </linearGradient>
    <linearGradient id="leafLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ec747"/>
      <stop offset="100%" stop-color="#3d9122"/>
    </linearGradient>
    <linearGradient id="leafRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64be3e"/>
      <stop offset="100%" stop-color="#338519"/>
    </linearGradient>
  </defs>

  <!-- Clean rounded badge canvas -->
  <rect width="128" height="128" rx="30" fill="url(#bgGlow)"/>

  <!-- Central Dark Background Leaf -->
  <path d="M64 96 C48 76 44 48 64 28 C84 48 80 76 64 96 Z" fill="#256e29"/>

  <!-- Left Bright Green Leaf -->
  <path d="M64 98 C36 84 20 62 26 36 C42 42 58 66 64 98 Z" fill="url(#leafLeft)"/>

  <!-- Right Bright Green Leaf -->
  <path d="M64 98 C92 84 108 62 102 36 C86 42 70 66 64 98 Z" fill="url(#leafRight)"/>

  <!-- Central Vibrant Orange Flame / Saffron Bud -->
  <path d="M64 62 C48 48 48 30 64 14 C80 30 80 48 64 62 Z" fill="url(#orangeFlame)"/>

  <!-- White / Cream Sprout Shoot Stem -->
  <line x1="64" y1="62" x2="64" y2="104" stroke="#fbf8ec" stroke-width="6.5" stroke-linecap="round"/>
</svg>